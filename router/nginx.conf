# The router in front of BOTH systems (strangler fig pattern).
# Clients only ever talk to http://localhost:8088 and never know which system answered.
server {
    listen 80;

    # ---- MIGRATED routes go to the NEW FastAPI service --------------------
    # Since Day 12 the API runs in compose, so nginx reaches it by service name.
    location = /tours.php {
        proxy_pass http://api:8001/legacy/tours;
    }

    # ---- Everything else still goes to the OLD PHP app --------------------
    location / {
        proxy_pass http://legacy:80;
    }
}
