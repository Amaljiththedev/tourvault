# The router in front of BOTH systems (strangler fig pattern).
# Clients only ever talk to http://localhost:8080 and never know which system answered.
server {
    listen 80;

    # ---- MIGRATED routes go to the NEW FastAPI service --------------------
    # Day 11 step 3: uncomment this block to switch /tours.php to FastAPI.
    # (TourVault runs on port 8001 because the dissertation backend container already uses 8000.)
    location = /tours.php {
        proxy_pass http://host.docker.internal:8001/legacy/tours;
    }

    # ---- Everything else still goes to the OLD PHP app --------------------
    location / {
        proxy_pass http://legacy:80;
    }
}
