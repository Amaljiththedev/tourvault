services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tourvault
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # S3-compatible object storage. MinIO's public Docker images are no longer
  # available, so this uses RustFS, a drop-in S3-compatible server.
  # The same boto3 code works against real AWS S3 by changing the endpoint.
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3 API (your code talks to this)
      - "9001:9001"   # web console: http://localhost:9001/rustfs/console/
    volumes:
      - storagedata:/data

  # The old system being replaced (Day 11: strangler fig demo).
  legacy:
    build: ./legacy-php
    volumes:
      - ./legacy-php/app:/var/www/html
    depends_on:
      - db

  # Router in front of old + new: clients only use http://localhost:8080
  router:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./router/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - legacy

volumes:
  pgdata:
  storagedata:
